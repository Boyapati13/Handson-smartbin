    <script>
      ;(function (l) {
        if (l.search[1] === '/') {
          const decoded = l.search
            .slice(1)
            .split('&')
            .map((s) => s.replace(/~and~/g, '&'))
            .join('?')
          // Remove trailing slash before replaying the original client-side route.
          const basePath = l.pathname.replace(/\/$/, '')
          window.history.replaceState(null, null, basePath + decoded + l.hash)
        }
      })(window.location)
    </script>
