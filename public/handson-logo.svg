<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 100" fill="none">
  <!-- Hand / cursor icon — recreated from official handson logo -->
  <g>
    <!-- Palm base -->
    <path d="M14 58 C14 52 18 48 24 48 L52 48 C58 48 62 52 62 58 L62 76 C62 84 56 88 48 88 L28 88 C20 88 14 84 14 78 Z" fill="#29ABE2"/>
    <!-- Index finger (pointing right, tallest) -->
    <rect x="28" y="10" width="10" height="44" rx="5" fill="#29ABE2"/>
    <!-- Middle finger -->
    <rect x="40" y="16" width="10" height="38" rx="5" fill="#29ABE2"/>
    <!-- Ring finger -->
    <rect x="16" y="22" width="10" height="32" rx="5" fill="#29ABE2"/>
    <!-- Pinky -->
    <rect x="4"  y="30" width="9"  height="26" rx="4.5" fill="#29ABE2"/>
  </g>

  <!-- "handson" wordmark — bold rounded lettering -->
  <text
    x="76" y="76"
    font-family="'Nunito', 'Figtree', 'Poppins', 'Syne', sans-serif"
    font-weight="900"
    font-size="68"
    fill="#29ABE2"
    letter-spacing="-1"
  >handson</text>
</svg>
