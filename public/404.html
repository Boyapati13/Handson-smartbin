<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Redirecting…</title>
    <script>
      // Keep the repo segment for GitHub Pages URLs, e.g. /Handson-smartbin/
      const pathSegmentsToKeep = 1
      const l = window.location
      const origin = `${l.protocol}//${l.hostname}${l.port ? `:${l.port}` : ''}`
      const repoBase = l.pathname.split('/').slice(0, 1 + pathSegmentsToKeep).join('/')
      const appPath = l.pathname
        .slice(1)
        .split('/')
        .slice(pathSegmentsToKeep)
        .join('/')
        .replace(/&/g, '~and~')
      const query = l.search ? `&${l.search.slice(1).replace(/&/g, '~and~')}` : ''

      l.replace(
        `${origin}${repoBase}/?/${appPath}${query}${l.hash}`,
      )
    </script>
  </head>
  <body></body>
</html>
